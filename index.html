<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Фотогалерея</title>
    <style>
        :root {
            --bg: #18181a;
            --surface: #222225;
            --text: #f2f2f2;
            --muted: #9e9ea4;
            --chocolate: #4d2814;
            --border: #2e2e32;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.5;
        }
        .hero {
            position: relative;
            height: 85vh;
            min-height: 500px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: #fff;
            background-color: var(--chocolate);
            background-size: cover;
            background-position: center;
            padding: 20px;
        }
        .hero::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(77, 40, 20, 0.58) 0%, rgba(45, 22, 10, 0.72) 100%);
            z-index: 1;
        }
        .hero-content {
            position: relative;
            z-index: 2;
            max-width: 800px;
        }
        .hero-date {
            font-size: 14px;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 16px;
            color: #f0dfd5;
        }
        .hero-title {
            font-size: clamp(32px, 5vw, 60px);
            font-weight: 300;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 12px;
        }
        .hero-author {
            font-size: 15px;
            color: #e6cfc3;
            margin-bottom: 36px;
        }
        .btn-outline {
            display: inline-block;
            padding: 14px 36px;
            border: 1px solid rgba(255, 255, 255, 0.85);
            color: #fff;
            text-decoration: none;
            font-size: 13px;
            letter-spacing: 2px;
            text-transform: uppercase;
            transition: 0.25s;
            cursor: pointer;
            background: rgba(77, 40, 20, 0.35);
        }
        .btn-outline:hover {
            background: #fff;
            color: var(--chocolate);
            border-color: #fff;
        }
        .toolbar {
            position: sticky;
            top: 0;
            z-index: 50;
            background: rgba(24, 24, 26, 0.92);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
            padding: 14px 24px;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }
        .toolbar-info {
            font-size: 13px;
            color: var(--muted);
        }
        .toolbar-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .btn-action {
            padding: 8px 16px;
            font-size: 13px;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text);
            border-radius: 4px;
            cursor: pointer;
            text-decoration: none;
            transition: 0.2s;
        }
        .btn-action:hover {
            border-color: #7a5c4d;
            background: #2b2b2f;
        }
        .btn-action.active {
            background: var(--chocolate);
            color: #fff;
            border-color: #754226;
        }
        .container {
            max-width: 1440px;
            margin: 0 auto;
            padding: 24px;
        }
        .gallery {
            column-count: 3;
            column-gap: 16px;
        }
        @media (max-width: 900px) { .gallery { column-count: 2; } }
        @media (max-width: 540px) { .gallery { column-count: 1; } }
        .photo-card {
            break-inside: avoid;
            margin-bottom: 16px;
            position: relative;
            overflow: hidden;
            background: var(--surface);
            cursor: zoom-in;
        }
        .photo-card img {
            width: 100%;
            display: block;
            transition: transform 0.4s ease;
        }
        .photo-card:hover img { transform: scale(1.02); }
        .card-overlay {
            position: absolute;
            top: 10px;
            right: 10px;
            display: flex;
            gap: 6px;
            opacity: 0;
            transition: opacity 0.2s;
        }
        .photo-card:hover .card-overlay,
        .photo-card.is-fav .card-overlay { opacity: 1; }
        .icon-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: none;
            background: rgba(24, 24, 26, 0.8);
            color: #fff;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            box-shadow: 0 2px 6px rgba(0,0,0,0.4);
            transition: 0.2s;
        }
        .icon-btn:hover { background: var(--chocolate); }
        .icon-btn.fav-active {
            background: #fff;
            color: #e53935;
        }
        .lightbox {
            position: fixed;
            inset: 0;
            background: rgba(12, 12, 14, 0.97);
            z-index: 100;
            display: none;
            justify-content: center;
            align-items: center;
        }
        .lightbox.open { display: flex; }
        .lightbox img {
            max-width: 92vw;
            max-height: 88vh;
            object-fit: contain;
        }
        .lb-close, .lb-prev, .lb-next {
            position: absolute;
            background: none;
            border: none;
            color: #fff;
            font-size: 32px;
            cursor: pointer;
            padding: 16px;
            user-select: none;
        }
        .lb-close { top: 10px; right: 16px; }
        .lb-prev { left: 10px; }
        .lb-next { right: 10px; }
        .lb-caption {
            position: absolute;
            bottom: 16px;
            color: var(--muted);
            font-size: 13px;
        }
        .status-msg {
            text-align: center;
            padding: 60px 20px;
            color: var(--muted);
        }
        footer {
            text-align: center;
            padding: 40px 20px;
            font-size: 13px;
            color: var(--muted);
            border-top: 1px solid var(--border);
            margin-top: 40px;
        }
    </style>
</head>
<body>

<header class="hero" id="hero">
    <div class="hero-content">
        <div class="hero-date" id="shootDate"></div>
        <h1 class="hero-title" id="shootTitle"></h1>
        <div class="hero-author" id="authorInfo"></div>
        <a href="#gallerySection" class="btn-outline">Смотреть фотографии</a>
    </div>
</header>

<div class="toolbar" id="gallerySection">
    <div class="toolbar-info" id="storageNotice"></div>
    <div class="toolbar-actions">
        <button class="btn-action" id="filterFavBtn" onclick="toggleFavFilter()">❤️ Избранное (<span id="favCount">0</span>)</button>
        <button class="btn-action" onclick="copyFavorites()">📋 Скопировать список для ретуши</button>
        <a class="btn-action" id="downloadAllLink" target="_blank">⬇️ Открыть папку на Диске</a>
    </div>
</div>

<main class="container">
    <div id="status" class="status-msg">Загрузка фотографий...</div>
    <div class="gallery" id="gallery"></div>
</main>

<footer>
    <span id="footerText"></span>
</footer>

<div class="lightbox" id="lightbox">
    <button class="lb-close" onclick="closeLightbox()">✕</button>
    <button class="lb-prev" onclick="changePhoto(-1)">‹</button>
    <img id="lbImg" src="" alt="">
    <button class="lb-next" onclick="changePhoto(1)">›</button>
    <div class="lb-caption" id="lbCaption"></div>
</div>

<script>
    const CONFIG = {
        apiKey: "AIzaSyBKXbCXx1wTpOTanZN7f7SIKRN-IX6jMBw",
        folderId: "1_PkAzgj09AeG3lEGH7zW-o4h3pCZurST",
        title: "ФОТОСЕССИЯ",
        date: "17.11.2026",
        author: "Грудкин Андрей • breed.dry@gmail.com",
        storageUntil: ""
    };

    document.title = CONFIG.title + " — " + CONFIG.date;
    document.getElementById('shootTitle').textContent = CONFIG.title;
    document.getElementById('shootDate').textContent = CONFIG.date;
    document.getElementById('authorInfo').textContent = CONFIG.author;
    document.getElementById('footerText').textContent = CONFIG.author;
    document.getElementById('storageNotice').textContent = CONFIG.storageUntil;
    document.getElementById('downloadAllLink').href = "https://google.com" + CONFIG.folderId;

    let photos = [];
    let favorites = JSON.parse(localStorage.getItem("fav_" + CONFIG.folderId) || "[]");
    let showOnlyFavs = false;
    let currentIndex = 0;

    async function loadPhotos() {
        const statusEl = document.getElementById('status');
        try {
            const query = encodeURIComponent("'" + CONFIG.folderId + "' in parents and mimeType contains 'image/' and trashed = false");
            const url = "https://googleapis.com" + query + "&fields=files(id,name)&orderBy=name&pageSize=1000&key=" + CONFIG.apiKey;
            
            const res = await fetch(url);
            const data = await res.json();

            if (data.error) {
                throw new Error(data.error.message);
            }

            photos = data.files || [];
            if (photos.length === 0) 
{
statusEl.textContent = "В папке пока нет фотографий или к ней не открыт общий доступ.";
return;
}
const coverUrl = "google.com" + photos[0].id + "&sz=w2000";
document.getElementById('hero').style.backgroundImage = "url('" + coverUrl + "')";
statusEl.style.display = 'none';
updateFavCounter();
renderGallery();
} catch (err) {
statusEl.innerHTML = "Ошибка загрузки: " + err.message + "
Проверьте API Key, ID папки и общий доступ по ссылке.";
}
}
function renderGallery() {
const gallery = document.getElementById('gallery');
gallery.innerHTML = '';
const list = showOnlyFavs ? photos.filter(p => favorites.includes(p.name)) : photos;
list.forEach((photo) => {
const isFav = favorites.includes(photo.name);
const card = document.createElement('div');
card.className = "photo-card " + (isFav ? "is-fav" : "");
const thumbUrl = "google.com" + photo.id + "&sz=w1000";
const downloadUrl = "google.com" + photo.id;
card.innerHTML =
'' +
'' +
'♥' +
'↓' +
'';
gallery.appendChild(card);
});
}
function toggleFavorite(e, fileName) {
e.stopPropagation();
if (favorites.includes(fileName)) {
favorites = favorites.filter(f => f !== fileName);
} else {
favorites.push(fileName);
}
localStorage.setItem("fav_" + CONFIG.folderId, JSON.stringify(favorites));
updateFavCounter();
renderGallery();
}
function updateFavCounter() {
document.getElementById('favCount').textContent = favorites.length;
}
function toggleFavFilter() {
showOnlyFavs = !showOnlyFavs;
document.getElementById('filterFavBtn').classList.toggle('active', showOnlyFavs);
renderGallery();
}
function copyFavorites() {
if (favorites.length === 0) {
alert('Вы еще не отметили ни одной фотографии сердечком.');
return;
}
const text = "Отобранные фото (" + favorites.length + " шт.):\n" + favorites.join("\n");
navigator.clipboard.writeText(text).then(() => {
alert('Список имен файлов скопирован! Отправьте его фотографу в мессенджер.');
});
}
function openLightbox(photoId) {
currentIndex = photos.findIndex(p => p.id === photoId);
updateLightbox();
document.getElementById('lightbox').classList.add('open');
}
function closeLightbox() {
document.getElementById('lightbox').classList.remove('open');
}
function changePhoto(step) {
currentIndex = (currentIndex + step + photos.length) % photos.length;
updateLightbox();
}
function updateLightbox() {
const photo = photos[currentIndex];
document.getElementById('lbImg').src = "google.com" + photo.id + "&sz=w2000";
document.getElementById('lbCaption').textContent = photo.name + " (" + (currentIndex + 1) + " из " + photos.length + ")";
}
document.addEventListener('keydown', (e) => {
if (!document.getElementById('lightbox').classList.contains('open')) return;
if (e.key === 'Escape') closeLightbox();
if (e.key === 'ArrowRight') changePhoto(1);
if (e.key === 'ArrowLeft') changePhoto(-1);
});
loadPhotos();
</script>

</body>
</html>
